# Конфигурация миграций.
# Ревизии лежат в migrations_versions/ плоским списком: ограничение структуры
# проекта запрещает вложенность вида migrations/versions/*.py.

[alembic]
script_location = migrations
version_locations = migrations_versions
prepend_sys_path = .
path_separator = os
timezone = UTC

# URL базы подставляется из окружения в migrations/env.py.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
