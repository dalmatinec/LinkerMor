services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-linkermor}
      POSTGRES_USER: ${POSTGRES_USER:-linkermor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD обязателен}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-linkermor} -d ${POSTGRES_DB:-linkermor}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # appendonly: состояние FSM и счётчики переживают перезапуск контейнера.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Миграции применяются до запуска бота, чтобы схема всегда была актуальной.
    command: ["sh", "-c", "alembic upgrade head && python main.py"]
    volumes:
      # Копии переживают пересборку образа.
      - ./backups:/app/backups

volumes:
  pgdata:
  redisdata:
